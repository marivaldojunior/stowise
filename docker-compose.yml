name: stowise

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stowise}
      POSTGRES_USER: ${POSTGRES_USER:-stowise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stowise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      dashboard:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Stowise: Host=db;Port=5432;Database=${POSTGRES_DB:-stowise};Username=${POSTGRES_USER:-stowise};Password=${POSTGRES_PASSWORD:-stowise}
      # Traces, métricas e logs via OTLP para o Aspire Dashboard
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      # IA (ADR-0004): desligada sem chave. A chave vem do .env e fica só no servidor.
      Ia__Habilitada: ${STOWISE_IA_HABILITADA:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Fallback local: Ollama rodando na máquina host
      Ia__Reserva__Endpoint: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"

  dashboard:
    # Aspire Dashboard: interface local para traces, métricas e logs (recebe OTLP gRPC na porta 18889)
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    restart: unless-stopped
    environment:
      # Só para uso local: sem login no dashboard nem no OTLP
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "${DASHBOARD_PORT:-18888}:18888"

volumes:
  db-data:
