<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stowise</title>
    <script>
      // Aplica o tema salvo antes do React, para a tela não piscar em claro (mesma chave de src/app/tema/contexto.ts).
      try {
        const tema = localStorage.getItem('stowise-tema') ?? 'system'
        const escuro = tema === 'dark' || (tema === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', escuro)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
