name: api

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
          cache: true
          cache-dependency-path: api/**/packages.lock.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        env:
          # Testes com Testcontainers não podem ser pulados no CI
          STOWISE_REQUIRE_DOCKER: "true"
        run: dotnet test --no-build -c Release --settings coverage.runsettings --results-directory TestResults

      - name: Relatório de cobertura
        if: success() || failure()
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"MarkdownSummaryGithub;Html" -title:"Stowise API"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage-report
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem
        run: docker build -t stowise-api:ci .
