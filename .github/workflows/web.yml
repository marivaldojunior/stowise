name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'api/openapi/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'api/openapi/**', '.github/workflows/web.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # O cliente gerado (orval) tem de bater com o contrato versionado da API.
      - name: Cliente da API igual ao contrato
        run: |
          npm run api:gerar
          if [ -n "$(git status --porcelain -- src/api/gerado)" ]; then
            git status --porcelain -- src/api/gerado
            echo "::error::src/api/gerado não bate com api/openapi/v1.json. Rode 'npm run api:gerar' em web/ e faça o commit."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
