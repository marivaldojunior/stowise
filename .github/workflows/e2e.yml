name: e2e

# Ponta a ponta: o painel (Vite) contra a API e o banco reais do docker compose, com o Playwright.
on:
  push:
    branches: [main]
    paths: ['web/**', 'api/**', 'infra/**', 'docker-compose.yml', 'Dockerfile', '.dockerignore', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['web/**', 'api/**', 'infra/**', 'docker-compose.yml', 'Dockerfile', '.dockerignore', '.github/workflows/e2e.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Ambiente Development: migrations, dados de exemplo e o Admin de desenvolvimento (AdminBootstrap).
      - name: Banco e API (docker compose)
        run: docker compose up -d --build db api

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Esperar a API ficar pronta
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::A API não ficou pronta em 3 minutos."
          docker compose logs api
          exit 1

      - run: npm run e2e
        working-directory: web
        env:
          STOWISE_API_URL: http://localhost:8080

      - name: Logs da API
        if: failure()
        run: docker compose logs api

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Imagem de demonstração (Dockerfile da raiz): painel + API numa só origem, em Production, como no deploy.
  imagem-demonstracao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: stowise
          POSTGRES_USER: stowise
          POSTGRES_PASSWORD: stowise
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U stowise" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Build da imagem
        run: docker build -t stowise-demo .

      - name: Subir a imagem (Production, com dados e contas de demonstração)
        run: |
          docker run -d --name stowise --network host \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__Stowise="Host=localhost;Port=5432;Database=stowise;Username=stowise;Password=stowise" \
            -e Jwt__SigningKey="chave-so-do-ci-0123456789abcdef0123456789" \
            -e Database__MigrateOnStartup=true \
            -e Database__SeedSampleData=true \
            -e Demonstracao__Senha="Demo-Stowise-2026" \
            stowise-demo
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs stowise
          exit 1

      - name: Painel, API e conta de demonstração
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/catalogo/qualquer | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/produtos)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/nao-existe)" = 404
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"gestor@demo.stowise.dev","senha":"Demo-Stowise-2026"}' | grep -q accessToken

      - name: Logs da API
        if: failure()
        run: docker logs stowise

