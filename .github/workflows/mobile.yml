name: mobile

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'api/openapi/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'api/openapi/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      atualizar_goldens:
        description: 'Regravar os goldens no Linux e publicar as imagens como artefato'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java do openapi-generator (geração do cliente da API).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      # O cliente gerado (openapi-generator, dart-dio) tem de bater com o contrato versionado da API (ADR-0008).
      - name: Cliente da API igual ao contrato
        run: |
          bash tool/gerar_cliente.sh
          if [ -n "$(git status --porcelain -- packages/stowise_api)" ]; then
            git status --porcelain -- packages/stowise_api
            echo "::error::packages/stowise_api não bate com api/openapi/v1.json. Rode 'tool/gerar_cliente.sh' em mobile/ e faça o commit."
            exit 1
          fi
      - name: Lint (format)
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  # Regrava os goldens no Linux (a referência) e publica as imagens; baixe o artefato e faça o commit em test/goldens.
  goldens:
    if: github.event_name == 'workflow_dispatch' && inputs.atualizar_goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get
      - run: flutter test --update-goldens

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: mobile/test/goldens
          retention-days: 7

  # Teste de integração (integration_test) num emulador Android: o app real, com API, cofre e preferências em memória.
  integracao:
    needs: analyze-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # Aceleração de hardware (KVM) para o emulador x86_64.
      - name: Ligar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: flutter test integration_test --flavor dev

  # APK de demonstração (flavor prod, release assinado com a chave de debug; ADR-0008). A URL da API vem da variável
  # do repositório STOWISE_API_URL (Settings > Secrets and variables > Actions > Variables).
  apk:
    needs: analyze-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      - name: Build do APK (prod)
        run: |
          # Um APK por arquitetura (menor); a maioria dos celulares atuais usa o arm64-v8a.
          flutter build apk --release --split-per-abi --flavor prod -t lib/main_prod.dart \
            --build-number "${{ github.run_number }}" \
            --dart-define=STOWISE_API_URL="${{ vars.STOWISE_API_URL }}"
          for apk in build/app/outputs/flutter-apk/app-*-prod-release.apk; do
            abi="$(basename "$apk" -prod-release.apk)"
            abi="${abi#app-}"
            mv "$apk" "stowise-${GITHUB_SHA::7}-$abi.apk"
          done
          ls -la stowise-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stowise-apk
          path: mobile/stowise-*.apk
          retention-days: 30
