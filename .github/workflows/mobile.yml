name: mobile

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'api/openapi/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'api/openapi/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java do openapi-generator (geração do cliente da API).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      # O cliente gerado (openapi-generator, dart-dio) tem de bater com o contrato versionado da API (ADR-0008).
      - name: Cliente da API igual ao contrato
        run: |
          bash tool/gerar_cliente.sh
          if [ -n "$(git status --porcelain -- packages/stowise_api)" ]; then
            git status --porcelain -- packages/stowise_api
            echo "::error::packages/stowise_api não bate com api/openapi/v1.json. Rode 'tool/gerar_cliente.sh' em mobile/ e faça o commit."
            exit 1
          fi
      - name: Lint (format)
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # APK de demonstração (flavor prod, release assinado com a chave de debug; ADR-0008). A URL da API vem da variável
  # do repositório STOWISE_API_URL (Settings > Secrets and variables > Actions > Variables).
  apk:
    needs: analyze-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      - name: Build do APK (prod)
        run: |
          # Um APK por arquitetura (menor); a maioria dos celulares atuais usa o arm64-v8a.
          flutter build apk --release --split-per-abi --flavor prod -t lib/main_prod.dart \
            --build-number "${{ github.run_number }}" \
            --dart-define=STOWISE_API_URL="${{ vars.STOWISE_API_URL }}"
          for apk in build/app/outputs/flutter-apk/app-*-prod-release.apk; do
            abi="$(basename "$apk" -prod-release.apk)"
            abi="${abi#app-}"
            mv "$apk" "stowise-${GITHUB_SHA::7}-$abi.apk"
          done
          ls -la stowise-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stowise-apk
          path: mobile/stowise-*.apk
          retention-days: 30
