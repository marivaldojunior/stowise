name: stowise_mobile
description: "Stowise — app de campo: movimentação de estoque, consulta de saldo e leitura de código de barras."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  built_collection: 5.1.2
  built_value: 8.13.0
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 18.0.2
  mobile_scanner: 7.4.2
  shared_preferences: 2.5.5
  # Cliente da API gerado do contrato (tool/gerar_cliente.sh, ADR-0008).
  stowise_api:
    path: packages/stowise_api
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
